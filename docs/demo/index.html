<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Sillytavern App · 聊天界面演示</title>
  <link rel="stylesheet" href="style.css">
  <script src="demo.js" defer></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="arrow" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
    <symbol id="moon" viewBox="0 0 24 24"><path d="M20 13a8.2 8.2 0 0 1-9-9 8.5 8.5 0 1 0 9 9Z"/></symbol>
    <symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="send" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="book" viewBox="0 0 24 24"><path d="M12 5v15M3 4c4 0 6 0 9 2 3-2 5-2 9-2v14c-4 0-6 0-9 2-3-2-5-2-9-2Z"/></symbol>
    <symbol id="chat" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 1-8 8H4l1-4a8 8 0 1 1 15-4Z"/></symbol>
    <symbol id="more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="leaf" viewBox="0 0 24 24"><path d="M5 19c-3-10 3-13 15-14 0 10-4 16-12 12M5 20 16 9"/></symbol>
  </svg>
  <main class="app">
    <aside class="sidebar" aria-label="演示会话">
      <a class="brand" href="https://github.com/zjldg666/sillytavern-app"><span class="brand-mark">S</span><span>Sillytavern<small>APP</small></span></a>
      <div class="sidebar-intro">留一点时间，<br>给故事。</div>
      <p class="section-caption">演示会话</p>
      <nav class="conversations" aria-label="选择演示会话"></nav>
      <div class="sidebar-foot"><svg><use href="#book"/></svg><span>原创合成内容<br><small>不读取角色卡与私人聊天</small></span></div>
    </aside>
    <section class="workspace" aria-label="聊天演示">
      <header class="header">
        <button class="icon-button mobile-back" id="choose-chat" aria-label="选择演示会话"><svg><use href="#arrow"/></svg></button>
        <span class="chat-avatar" aria-hidden="true">林</span>
        <div class="heading"><h1 id="chat-title">林间来信</h1><p><span class="status-dot"></span>界面演示 · 合成对话</p></div>
        <button class="icon-button theme-button" id="theme-toggle" aria-label="切换到黑夜模式"><svg><use href="#moon"/></svg></button>
        <button class="icon-button" id="about" aria-label="演示说明"><svg><use href="#more"/></svg></button>
      </header>
      <div class="transcript" id="transcript" role="log" aria-label="合成聊天记录" aria-live="polite"></div>
      <footer class="composer-area">
        <div class="suggestions" aria-label="演示快捷回复"><button data-prompt="推开门，看看里面。">推门进去 <span>↗</span></button><button data-prompt="先听听窗边的人在讲什么。">在窗边坐下 <span>↗</span></button></div>
        <form class="composer" id="composer">
          <button type="button" class="icon-button" id="demo-info" aria-label="查看演示说明"><svg><use href="#plus"/></svg></button>
          <textarea id="message" rows="1" maxlength="600" placeholder="写下你的下一句…" aria-label="消息内容"></textarea>
          <button type="submit" class="send-button" aria-label="发送演示消息" disabled><svg><use href="#send"/></svg></button>
        </form>
        <p class="demo-caption">Sillytavern App <span>·</span> 本地交互演示，未连接模型 API</p>
      </footer>
    </section>
  </main>
  <dialog id="info-dialog"><div class="dialog-body"><span class="eyebrow">ABOUT THIS DEMO</span><h2>只是一段演示。</h2><p>这里使用原创合成对话与 AI 生成的原创角色肖像，展示 Sillytavern App 的聊天阅读体验。发送内容只存在当前页面，回复为预置文本，不会调用模型 API。</p><p>这是独立的 README 演示前端，不是 Android 实机截图，也不作为 App 功能验收证据。</p><button class="dialog-close">知道了</button></div></dialog>
  <dialog id="chat-dialog"><div class="dialog-body"><h2>选择一段故事</h2><nav class="conversations"></nav><button class="dialog-close">返回</button></div></dialog>
</body>
</html>
